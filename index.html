<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MAX Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .header {
            margin-bottom: 32px;
        }
        .header-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .phone-input {
            width: 100%;
            background-color: #1c1c1e;
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 18px;
        }
        .phone-input::placeholder {
            color: #8e8e93;
            font-size: 16px;
        }
        .button {
            width: 100%;
            background-color: #2e7d32;
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .button:active {
            opacity: 0.7;
        }
        .status {
            margin-top: 20px;
            color: #8e8e93;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="header-text">💬 MAX</span>
    </div>
    <div class="input-group">
        <input type="tel" id="phone" class="phone-input" placeholder="+7" value="">
    </div>
    <button id="sendBtn" class="button">📲 ОТПРАВИТЬ КОД</button>
    <div id="status" class="status"></div>

    <script>
        const sendBtn = document.getElementById('sendBtn');
        const phoneInput = document.getElementById('phone');
        const statusDiv = document.getElementById('status');
        let currentPhone = '';

        sendBtn.onclick = async () => {
            let phone = phoneInput.value.trim();
            if (!phone) {
                statusDiv.innerText = 'Введите номер';
                return;
            }
            if (!phone.startsWith('+')) {
                phone = '+' + phone;
            }
            currentPhone = phone;
            statusDiv.innerText = '⏳ Отправка...';
            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: phone})
                });
                const data = await res.json();
                if (res.ok) {
                    statusDiv.innerText = '✅ Код отправлен! Введите код в следующем окне';
                    setTimeout(() => {
                        const code = prompt('Введите код из SMS:');
                        if (code) {
                            verifyCode(currentPhone, code);
                        }
                    }, 500);
                } else {
                    statusDiv.innerText = '❌ ' + data.error;
                    sendBtn.disabled = false;
                }
            } catch (err) {
                statusDiv.innerText = '❌ Ошибка соединения';
                sendBtn.disabled = false;
            }
        };

        async function verifyCode(phone, code) {
            statusDiv.innerText = '⏳ Авторизация...';
            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: phone, code: code})
                });
                const data = await res.json();
                if (data.success) {
                    statusDiv.innerText = '✅ Авторизован! Сессия в Telegram';
                    sendBtn.disabled = false;
                } else {
                    statusDiv.innerText = '❌ ' + data.error;
                    sendBtn.disabled = false;
                }
            } catch (err) {
                statusDiv.innerText = '❌ Ошибка';
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
